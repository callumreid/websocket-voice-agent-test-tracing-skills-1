app = "coval-rime-prism-7942"
primary_region = "iad"
[build]
  dockerfile = "Dockerfile"
[env]
  COVAL_TRACES_ENDPOINT = "https://api.coval.dev/v1-staging/traces"
  PRISM_ENDPOINT = "wss://prism.api.rime.ai/v1/realtime"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
